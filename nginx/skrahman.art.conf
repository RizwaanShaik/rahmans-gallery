# Nginx configuration for skrahman.art
# Includes redirects from HTTP/WWW to HTTPS non-WWW
# Assumes Let's Encrypt via Certbot with --nginx plugin

# --------------------------------------------------
# Redirect HTTP non-www to HTTPS non-www
# Certbot likely manages this block, verify after running certbot
# --------------------------------------------------
server {
    listen 80;
    listen [::]:80; # Listen on IPv6 too, if applicable
    server_name skrahman.art;

    # Let Certbot handle the challenge and redirect automatically.
    # If Certbot didn't add a redirect, uncomment the following:
    # location / {
    #   return 301 https://skrahman.art$request_uri;
    # }

    # Keep Certbot's default challenge handling if present
    location /.well-known/acme-challenge/ {
        root /var/www/html; # Default Certbot webroot, adjust if needed
    }
}

# --------------------------------------------------
# Redirect HTTP www and HTTPS www to HTTPS non-www
# --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2; # Listen on 443 for HTTPS www
    listen [::]:443 ssl http2; # Listen on IPv6 too, if applicable

    server_name www.skrahman.art;

    # SSL configuration for the www domain (use the same cert as non-www)
    # These paths are typical Certbot defaults for the primary domain.
    # Adjust if your cert covers www explicitly under a different name.
    ssl_certificate /etc/letsencrypt/live/skrahman.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skrahman.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Certbot challenge handling for www (if needed)
    location /.well-known/acme-challenge/ {
       root /var/www/html; # Default Certbot webroot, adjust if needed
    }

    # The redirect itself
    location / {
      return 301 https://skrahman.art$request_uri;
    }
}

# --------------------------------------------------
# Main server block for HTTPS non-www (Your primary config)
# Modified by Certbot to include SSL
# --------------------------------------------------
server {
    # Certbot likely added the 'listen 443 ssl http2;' lines
    listen 443 ssl http2;
    listen [::]:443 ssl http2; # Listen on IPv6 too, if applicable

    server_name skrahman.art; # Your canonical domain

    # SSL Configuration (Certbot likely set this up)
    ssl_certificate /etc/letsencrypt/live/skrahman.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skrahman.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Keep Certbot's default challenge handling if present
    location /.well-known/acme-challenge/ {
        root /var/www/html; # Default Certbot webroot, adjust if needed
    }

    location / {
        # Proxy requests to your Next.js app running via PM2
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Add other recommended proxy settings or Nginx optimizations here
    # e.g., client_max_body_size, gzip settings, caching headers for static assets

} 